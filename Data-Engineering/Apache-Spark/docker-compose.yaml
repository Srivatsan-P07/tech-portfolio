version: '3.8'

services:
  spark-master:
    image: jupyter/pyspark-notebook:latest
    container_name: spark-master
    user: root
    ports:
      - "8080:8080"
      - "7077:7077"
    environment:
      - SPARK_PUBLIC_DNS=localhost
    command: >
      /usr/local/spark/bin/spark-class
      org.apache.spark.deploy.master.Master
      --host spark-master
      --port 7077
      --webui-port 8080
    networks:
      - spark-network

  spark-worker-1:
    image: jupyter/pyspark-notebook:latest
    container_name: spark-worker-1
    user: root
    depends_on:
      - spark-master
    ports:
      - "8081:8081"
    environment:
      - SPARK_PUBLIC_DNS=localhost
    command: >
      /usr/local/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      --webui-port 8081
      spark://spark-master:7077
    networks:
      - spark-network

  spark-worker-2:
    image: jupyter/pyspark-notebook:latest
    container_name: spark-worker-2
    user: root
    depends_on:
      - spark-master
    ports:
      - "8082:8082"
    environment:
      - SPARK_PUBLIC_DNS=localhost
    command: >
      /usr/local/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      --webui-port 8082
      spark://spark-master:7077
    networks:
      - spark-network

  pyspark-notebook:
    image: jupyter/pyspark-notebook:latest
    container_name: pyspark-notebook
    ports:
      - "8888:8888"
      - "4040:4040"
      - "4041:4041"
      - "4042:4042"
    environment:
      - SPARK_PUBLIC_DNS=localhost
      - PYSPARK_SUBMIT_ARGS=--master spark://spark-master:7077 --conf spark.ui.port=4040 --conf spark.ui.bindAddress=0.0.0.0 --conf spark.driver.host=pyspark-notebook pyspark-shell
    volumes:
      - ./work:/home/jovyan/work
    networks:
      - spark-network

  pyspark-notebook-local:
    image: jupyter/pyspark-notebook:latest
    container_name: pyspark-notebook-local
    ports:
      - "8889:8888"
      - "4043:4040"
    volumes:
      - ./work:/home/jovyan/work
    command: >
      bash -c "
      pip install ipython-sql &&
      start-notebook.sh
      "
    networks:
      - spark-network

networks:
  spark-network:
    driver: bridge