version: '3.8'

services:
  spark-master:
    image: jupyter/pyspark-notebook:latest
    container_name: spark-master
    user: root
    ports:
      - "8080:8080"
      - "7077:7077"
    environment:
      - SPARK_MODE=master
    command: >
      /usr/local/spark/bin/spark-class org.apache.spark.deploy.master.Master
    networks:
      - spark-network

  spark-worker-1:
    image: jupyter/pyspark-notebook:latest
    container_name: spark-worker-1
    user: root
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
    command: >
      /usr/local/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    ports:
      - "8081:8081"
    networks:
      - spark-network

  spark-worker-2:
    image: jupyter/pyspark-notebook:latest
    container_name: spark-worker-2
    user: root
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
    command: >
      /usr/local/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    ports:
      - "8082:8081"
    networks:
      - spark-network

  pyspark-notebook:
    image: jupyter/pyspark-notebook:latest
    container_name: pyspark-notebook
    ports:
      - "8888:8888"
      - "4040:4040"  # <--- Add this line
    environment:
      - PYSPARK_SUBMIT_ARGS=--master spark://spark-master:7077 pyspark-shell
    networks:
      - spark-network

  pyspark-notebook-local:
    image: jupyter/pyspark-notebook:latest
    container_name: pyspark-notebook-local
    ports:
      - "8889:8888"
      - "4041:4040"  # <--- Add this line
    #environment:
      #- PYSPARK_SUBMIT_ARGS=--master spark://spark-master:7077 pyspark-shell
    networks:
      - spark-network

networks:
  spark-network:
    driver: bridge